name: Growl of Vampire APK
on:
  push:
    branches: [growl-of-vampire-apk]
    paths: ['growl-of-vampire/**', '.github/workflows/growl-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: growl-of-vampire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Growl-of-Vampire-APK
          path: growl-of-vampire/app/build/outputs/apk/debug/app-debug.apk
